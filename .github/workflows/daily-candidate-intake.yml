name: Daily candidate intake

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: discovery-ai-index-candidate-intake
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger candidate-only source scan
        shell: bash
        env:
          INTAKE_URL: https://discovery-ai-index-api.helloarclabshq.workers.dev/api/intake/run
          INTAKE_TOKEN: ${{ secrets.DISCOVERY_AI_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if [[ -z "${INTAKE_TOKEN}" ]]; then
            echo "::error::DISCOVERY_AI_INTAKE_TOKEN is not configured."
            exit 1
          fi

          status_code="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            --header "Authorization: Bearer ${INTAKE_TOKEN}" \
            "$INTAKE_URL")"

          if (( status_code < 200 || status_code >= 300 )); then
            echo "::error::Candidate intake returned HTTP ${status_code}."
            exit 1
          fi

          node --input-type=module - "$response_file" <<'NODE'
          import { readFileSync } from "node:fs";

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (result.mode !== "candidate_only" || result.publicRecordsChanged !== 0) {
            throw new Error("The intake endpoint did not confirm the candidate-only policy.");
          }

          const failedSources = (Array.isArray(result.sources) ? result.sources : [])
            .filter((source) => source?.status === "failed");
          if (["partial", "failed"].includes(result.status) || failedSources.length > 0) {
            const failedSourceKeys = [...new Set(
              failedSources
                .map((source) => String(source?.sourceKey ?? "")
                  .replace(/[^A-Za-z0-9._-]+/g, "-")
                  .replace(/^-+|-+$/g, "")
                  .slice(0, 80))
                .filter(Boolean),
            )].sort();
            const annotation = failedSourceKeys.length
              ? failedSourceKeys.join(",")
              : "unknown-source";
            const failureKind = ["partial", "failed"].includes(result.status)
              ? result.status
              : "source-failure";
            console.error(`::error title=Candidate intake ${failureKind}::${annotation}`);
            process.exitCode = 1;
          } else {
            if (!["completed", "skipped"].includes(result.status)) {
              throw new Error("The intake endpoint returned an unexpected status.");
            }
            console.log(
              `Candidate intake ${result.status}: ${result.candidatesSeen ?? 0} seen, ` +
                `${result.candidatesAdded ?? 0} added, 0 public records changed.`,
            );
          }
          NODE
