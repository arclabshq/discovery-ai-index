<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovery Index mobile record comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: #e9e7e1;
        color: #17233d;
        font: 600 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      main {
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: flex-start;
      }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; }
      img {
        display: block;
        width: 300px;
        height: auto;
        background: #f7f4ec;
        box-shadow: 0 12px 36px rgba(23, 35, 61, 0.16);
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Before: full mobile card</figcaption>
        <img
          src="/qa/mobile-leaderboard-source-card-focus.png"
          alt="Full editorial discovery card on mobile"
        />
      </figure>
      <figure>
        <figcaption>After: expanded leaderboard row</figcaption>
        <img
          src="/qa/mobile-leaderboard-expanded.png"
          alt="Expanded mobile leaderboard row with discovery details"
        />
      </figure>
    </main>
  </body>
</html>
